[package]
name = "gigstark_escrow"
version = "0.1.0"
edition = "2024_07"

[dependencies]
starknet = "2.17.0"
openzeppelin = "3.0.0"
privacy = { git = "https://github.com/starkware-libs/starknet-privacy", tag = "PRIVACY-0.14.3-RC.0" }

[dev-dependencies]
assert_macros = "2.17.0"
snforge_std = "0.59.0"
starkware_utils_testing = { git = "https://github.com/starkware-libs/starkware-starknet-utils", rev = "0e12df09afe29f59a877a5b04801fedd8b31c50d" }

[tool.scarb]
allow-prebuilt-plugins = ["snforge_std"]

[patch."https://scarbs.dev/"]
snforge_std = "0.59.0"

[lib]

[[test]]
name = "gigstark_escrow_unittest"
build-external-contracts = [
  "gigstark_escrow::test_contracts::MockAuthorizationVerifier",
  "gigstark_escrow::test_contracts::MockGroth16VerifierBN254",
  "starkware_utils::erc20::erc20_mocks::DualCaseERC20Mock",
]

[[target.starknet-contract]]
sierra = true
casm = true
casm-add-pythonic-hints = true

[scripts]
test = "snforge test"
